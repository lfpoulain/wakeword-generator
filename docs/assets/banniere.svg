  <!-- Le score du modèle franchit le seuil à la fin du mot -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <path d="M88 332 H384 C412 332 430 312 448 288 C458 274 466 264 476 264 C488 264 496 292 508 318 C514 330 520 332 530 332 Z" fill="url(#aire)" />
    <line x1="88" y1="300" x2="530" y2="300" stroke="#9baba2" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 6" />
    <text x="88" y="292" font-size="13" fill="#9baba2" letter-spacing="1">SEUIL 0,5</text>
    <path d="M88 332 H384 C412 332 430 312 448 288 C458 274 466 264 476 264 C488 264 496 292 508 318 C514 330 520 332 530 332" fill="none" stroke="#6fd1bf" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="476" cy="264" r="7" fill="#6fd1bf" filter="url(#lueur)" />
    <circle cx="476" cy="264" r="3.6" fill="#f2efe8" />
  </g>

  <!-- Le réveil de Cornelius -->
  <path d="M488 256 Q536 214 566 202" fill="none" stroke="#6fd1bf" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round" stroke-dasharray="2 7" />
  <g transform="translate(608 196)">
    <circle r="66" fill="url(#halo)" />
    <circle r="42" fill="none" stroke="url(#irise)" stroke-width="4" opacity="0.5" filter="url(#flou)" />
    <circle r="38" fill="url(#orbe)" />
    <circle r="38" fill="none" stroke="url(#irise)" stroke-width="1.2" opacity="0.7" />
    <ellipse cx="-8" cy="-19" rx="19" ry="8" fill="#ffffff" opacity="0.28" />
  </g>

  <!-- Titre -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="716" y="176" font-size="74" font-weight="600" fill="#f2efe8" letter-spacing="2">Cornelius</text>
    <text x="720" y="228" font-size="40" font-weight="300" fill="#6fd1bf" letter-spacing="1">générateur de mot d’appel</text>
    <text x="720" y="276" font-size="22" fill="#9baba2">Un mot d’appel français pour openWakeWord,</text>
    <text x="720" y="306" font-size="22" fill="#9baba2">sans enregistrer une seule voix</text>
    <text x="720" y="350" font-size="17" fill="#6fd1bf" letter-spacing="1.5">VOIX DE SYNTHÈSE · DOCKER · MODÈLE ONNX</text>
