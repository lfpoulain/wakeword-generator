    <rect x="289.5" y="144" width="5" height="64" rx="2.5" />
    <rect x="299.5" y="155" width="5" height="42" rx="2.5" />
    <rect x="309.5" y="165" width="5" height="22" rx="2.5" />
    <rect x="319.5" y="167" width="5" height="18" rx="2.5" />
    <rect x="329.5" y="168" width="5" height="16" rx="2.5" />
    <rect x="339.5" y="168" width="5" height="16" rx="2.5" />
    <rect x="349.5" y="158" width="5" height="36" rx="2.5" />
    <rect x="359.5" y="151" width="5" height="50" rx="2.5" />
    <rect x="369.5" y="135" width="5" height="82" rx="2.5" />
    <rect x="379.5" y="132" width="5" height="88" rx="2.5" />
    <rect x="389.5" y="105" width="5" height="142" rx="2.5" />
    <rect x="399.5" y="108" width="5" height="136" rx="2.5" />
